name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.incremental=false

jobs:
  build:
    name: Build FirefoxLite APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JDK 17
      # Required by modern Android SDK command-line tools
      # ============================================================

      - name: Set up JDK 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      - name: Verify Android SDK packages
        run: |
          sdkmanager --list_installed

      # ============================================================
      # JDK 8
      # Required by legacy Gradle / Android Gradle Plugin
      # ============================================================

      - name: Switch to JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Verify JDK 8
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle version
        run: |
          ./gradlew --version

      # ============================================================
      # SHOW AVAILABLE FOCUS WEBKIT TASKS
      # Useful for diagnosing legacy variants
      # ============================================================

      - name: List Focus WebKit tasks
        shell: bash
        run: |
          ./gradlew tasks --all > gradle-tasks.txt || true

          echo "===== Focus WebKit tasks ====="

          grep -i "FocusWebkit" gradle-tasks.txt || true

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -o pipefail

          ./gradlew clean \
            --stacktrace \
            --no-daemon \
            2>&1 | tee clean.log

      # ============================================================
      # BUILD APK
      #
      # IMPORTANT:
      #
      # We intentionally exclude:
      #   - lint
      #   - lintVital
      #   - connected tests
      #   - instrumentation tests
      #   - screenshot tests
      #
      # This prevents old test-only dependencies such as:
      #   com.jraska:falcon
      #   tools.fastlane:screengrab
      #
      # from blocking APK packaging.
      #
      # Gradle still MUST successfully compile, dex and package
      # the actual application.
      # ============================================================

      - name: Build Focus WebKit Release APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :app:assembleFocusWebkitRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode=all \
            -x lint \
            -x lintVital \
            -x lintVitalFocusWebkitRelease \
            -x test \
            -x connectedCheck \
            -x connectedAndroidTest \
            -x connectedFocusWebkitDebugAndroidTest \
            -x connectedFocusWebkitReleaseAndroidTest \
            2>&1 | tee build.log

      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          echo "=========================================="
          echo "Generated APK files"
          echo "=========================================="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # VERIFY APK EXISTS
      # ============================================================

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle reported success but no APK was found."
            echo ""
            echo "Build output:"
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo ""
          echo "APK SHA256:"
          sha256sum "$APK"

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          cp "$APK" \
            "artifacts/FirefoxLite-CyberPrivacy-release-unsigned.apk"

          echo "Prepared artifact:"
          ls -lh artifacts/

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxLite-CyberPrivacy-release-unsigned
          path: artifacts/FirefoxLite-CyberPrivacy-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD BUILD LOG ON FAILURE
      # ============================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FirefoxLite-build-logs
          path: |
            build.log
            clean.log
            gradle-tasks.txt
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # SHOW FAILURE SUMMARY
      # ============================================================

      - name: Show build failure summary
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD FAILED"
          echo "=========================================="

          if [ -f build.log ]; then
            echo ""
            echo "===== Last 150 lines of build.log ====="
            tail -150 build.log
          fi
